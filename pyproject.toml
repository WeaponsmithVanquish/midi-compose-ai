[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "midi-compose-ai"
version = "0.6.2"
description = "AI MIDI composition generator — text/chord/reference-conditioned multi-track MIDI generation for Windows desktop."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "midi-compose-ai contributors" }]
keywords = ["midi", "music-generation", "ai", "composition", "desktop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Sound/Audio :: MIDI",
]

dependencies = [
  "mido>=1.3.2",
  "pretty_midi>=0.2.10",
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "click>=8.1",
  "rich>=13.7",
  "safetensors>=0.4",
]

[project.optional-dependencies]
torch = ["torch>=2.3", "torchaudio>=2.3"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7"]

[project.scripts]
midi-compose = "midi_compose_ai.bootstrap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/midi_compose_ai"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"